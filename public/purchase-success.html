<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles/style.css">
  <title data-i18n="page_title_success">Order confirmed — Smart Device</title>
</head>
<body class="store-page">
  <script src="/scripts/site-header.js"></script>
  <main class="success-page"><p class="eyebrow" data-i18n="success_title">Order confirmed</p><h1 data-i18n="success_message">Thank you for your purchase.</h1><p data-i18n="success_detail">Your order has been received. We will send delivery updates to your email address.</p><p class="order-number" id="order-number"></p><a class="store-button dark" href="/shop.html" data-i18n="success_continue">Continue shopping</a></main>
  <script>
    const ui = (key) => window.i18n ? window.i18n.t(key) : key;
    const id = new URLSearchParams(location.search).get('order_id');
    if (id) document.getElementById('order-number').textContent = ui('success_order_number') + ' ' + id;
    window.__i18nOnLanguageChange = function() { if (id) document.getElementById('order-number').textContent = ui('success_order_number') + ' ' + id; };
  </script>
  <script src="/scripts/theme.js"></script>
  <script src="/scripts/currency.js"></script>
  <script src="/scripts/i18n.js"></script>
  <script src="/scripts/header-manager.js"></script>
</body>
</html>
