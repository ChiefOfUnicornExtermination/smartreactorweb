<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles/style.css">
  <title data-i18n="page_title_cart">Cart — Smart Device</title>
</head>
<body class="store-page">
  <script src="/scripts/site-header.js"></script>
  <main class="store-section narrow-section">
    <div class="section-heading"><div><p class="eyebrow" data-i18n="cart_your_order">Your order</p><h1 data-i18n="shop_cart_title">Shopping cart</h1></div><a href="/shop.html" class="back-link" data-i18n="shop_continue">Continue shopping →</a></div>
    <div id="cart-content"></div>
  </main>
  <script>
    const API_URL = ['localhost', '127.0.0.1'].includes(window.location.hostname)
      ? 'http://localhost:8081'
      : 'https://api.unicornextermination.info';
    const esc = value => String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const ui = (key) => window.i18n ? window.i18n.t(key) : key;
    function renderCart() {
      const cart = JSON.parse(localStorage.getItem('shopping_cart') || '[]');
      document.getElementById('cart-count').textContent = cart.reduce((total, item) => total + item.quantity, 0);
      if (!cart.length) { document.getElementById('cart-content').innerHTML = '<div class="empty-store"><h2>' + ui('cart_empty_title') + '</h2><p>' + ui('cart_empty_text') + '</p><a class="store-button dark" href="/shop.html">' + ui('cart_shop_products') + '</a></div>'; return; }
      const subtotal = cart.reduce((total, item) => total + item.price * item.quantity, 0);
      document.getElementById('cart-content').innerHTML = `<div class="cart-layout"><div class="cart-items">${cart.map((item, index) => `<article class="cart-item"><img src="${esc(item.image_url || '/images/websiteimage.png')}" alt="${esc(item.name)}"><div class="cart-item-copy"><h2>${esc(item.name)}</h2><p>${window.currency ? window.currency.formatPrice(item.price) : '$' + item.price.toFixed(2)}</p><label>${ui('shop_quantity')} <input type="number" min="1" value="${item.quantity}" onchange="changeQuantity(${index}, this.value)"></label></div><strong>${window.currency ? window.currency.formatPrice(item.price * item.quantity) : '$' + (item.price * item.quantity).toFixed(2)}</strong><button class="remove-button" onclick="removeItem(${index})">${ui('cart_remove')}</button></article>`).join('')}</div><aside class="order-summary"><h2>${ui('cart_order_summary')}</h2><div><span>${ui('cart_subtotal')}</span><strong>${window.currency ? window.currency.formatPrice(subtotal) : '$' + subtotal.toFixed(2)}</strong></div><div><span>${ui('cart_shipping')}</span><span>${ui('cart_shipping_calc')}</span></div><div class="summary-total"><span>${ui('cart_total')}</span><strong>${window.currency ? window.currency.formatPrice(subtotal) : '$' + subtotal.toFixed(2)}</strong></div><a class="store-button dark full-width" href="/checkout.html">${ui('cart_checkout')}</a></aside></div>`;
    }
    function changeQuantity(index, value) { const cart = JSON.parse(localStorage.getItem('shopping_cart') || '[]'); cart[index].quantity = Math.max(1, Number(value) || 1); localStorage.setItem('shopping_cart', JSON.stringify(cart)); renderCart(); }
    function removeItem(index) { const cart = JSON.parse(localStorage.getItem('shopping_cart') || '[]'); cart.splice(index, 1); localStorage.setItem('shopping_cart', JSON.stringify(cart)); renderCart(); }
    window.__i18nOnLanguageChange = renderCart;
    window.__currencyOnChange = renderCart;
    renderCart();
  </script>
  <script src="/scripts/theme.js"></script>
  <script src="/scripts/currency.js"></script>
  <script src="/scripts/i18n.js"></script>
  <script src="/scripts/header-manager.js"></script>
</body>
</html>
