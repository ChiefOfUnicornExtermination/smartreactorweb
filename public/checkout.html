<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles/style.css">
  <title>Checkout — Smart Device</title>
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="store-page">
  <header class="store-header">
    <a class="store-brand" href="/shop.html">SMART DEVICE</a>
    <nav class="store-nav">
      <a href="/shop.html" data-i18n="shop_nav_shop">Shop</a>
      <a href="/about.html" data-i18n="shop_nav_about">About</a>
      <a href="/contact.html" data-i18n="shop_nav_contact">Contact</a>
      <a id="devices-nav-link" href="/devices.html" data-i18n="shop_nav_my_devices" style="display:none;">My Devices</a>
    </nav>
    <div class="store-actions">
      <select id="lang-select" aria-label="Language" style="padding:6px 8px;border:1px solid #d8d8d8;background:#fff;">
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="zh-TW">繁體中文</option>
        <option value="ko">한국어</option>
      </select>
      <span id="user-welcome" data-i18n="welcome_text" style="display:none;">Welcome!</span>
      <button id="toggle-auth-tab" data-i18n="login_tab" style="background:none;border:none;cursor:pointer;color:#17202a;font-weight:600;">Login</button>
      <button id="logout-btn" data-i18n="logout_btn" style="display:none;background:none;border:none;cursor:pointer;color:#17202a;font-weight:600;">Logout</button>
      <a id="cart-nav-link" href="/cart.html" class="cart-link" style="display:none;"><span data-i18n="shop_cart">Cart</span> <span id="cart-count">0</span></a>
    </div>
  </header>
  <main class="store-section narrow-section">
    <div class="section-heading"><div><p class="eyebrow" data-i18n="checkout_secure">SECURE CHECKOUT</p><h1 data-i18n="checkout_title">Complete your order</h1></div></div>
    <form id="checkout-form" class="checkout-layout">
      <div class="checkout-form">
        <h2 data-i18n="checkout_contact_title">Contact and shipping</h2>
        <div class="form-grid">
          <div><label data-i18n="checkout_email">Email</label><input type="email" name="email" required autocomplete="email"></div>
          <div><label data-i18n="checkout_full_name">Full name</label><input name="name" required autocomplete="name"></div>
          <div><label class="wide" data-i18n="checkout_address">Address</label><input name="address" required autocomplete="street-address"></div>
          <div><label data-i18n="checkout_city">City</label><input name="city" required autocomplete="address-level2"></div>
          <div><label data-i18n="checkout_postal">Postal code</label><input name="postal_code" required autocomplete="postal-code"></div>
          <div><label data-i18n="checkout_country">Country</label><select name="country" required><option value="">Select country</option><option>United States</option><option>Japan</option><option>Canada</option><option>United Kingdom</option></select></div>
        </div>
        <h2 data-i18n="checkout_payment_title">Payment</h2>
        <div id="card-element" style="border: 1px solid #d8d8d8; padding: 10px; margin: 15px 0; background: #fff; border-radius: 4px; font-family: inherit;"></div>
        <p class="form-note" data-i18n="checkout_note">Payment details are processed securely by Stripe and are not stored by this page.</p><div id="checkout-error" class="store-status error"></div>
      </div>
      <aside id="checkout-summary" class="order-summary"></aside>
    </form>
  </main>
  <script>
    const API_URL = ['localhost', '127.0.0.1'].includes(window.location.hostname)
      ? 'http://localhost:8081'
      : 'https://api.unicornextermination.info';
    const STRIPE_PUBLIC_KEY = 'pk_test_51UFTkD30G07KgVpy6P6FTASpeghfZtTgq0UTJR3d2ipFNiv7ITFDj1PDWOVfcIGkV797N7185vCa9oVS9FkePBo400L6jiXoe7';
    const ui = (key) => window.i18n ? window.i18n.t(key) : key;
    const cart = JSON.parse(localStorage.getItem('shopping_cart') || '[]');
    const token = localStorage.getItem('auth_token');
    const subtotal = cart.reduce((total, item) => total + item.price * item.quantity, 0);
    
    document.getElementById('cart-count').textContent = cart.reduce((total, item) => total + item.quantity, 0);
    if (!cart.length) location.replace('/cart.html');
    
    // Initialize Stripe
    const stripe = Stripe(STRIPE_PUBLIC_KEY);
    const elements = stripe.elements();
    const cardElement = elements.create('card', {
      style: {
        base: { fontSize: '14px', color: '#32325d', fontFamily: 'inherit' },
        invalid: { color: '#fa755a' }
      }
    });
    cardElement.mount('#card-element');
    
    // Handle card errors
    cardElement.addEventListener('change', (event) => {
      const displayError = document.getElementById('checkout-error');
      if (event.error) {
        displayError.textContent = event.error.message;
      } else {
        displayError.textContent = '';
      }
    });
    
    function renderSummary() {
      document.getElementById('checkout-summary').innerHTML = `<h2>${ui('checkout_order_summary')}</h2>${cart.map(item => `<div><span>${item.name} × ${item.quantity}</span><strong>$${(item.price * item.quantity).toFixed(2)}</strong></div>`).join('')}<div class="summary-total"><span>${ui('cart_total')}</span><strong>¥${Math.round(subtotal)}</strong></div><button class="store-button dark full-width" type="submit">${ui('checkout_place_order')}</button>`;
      const countrySelect = document.querySelector('select[name="country"]');
      if (countrySelect) {
        countrySelect.innerHTML = `<option value="">${ui('checkout_select_country')}</option><option>${ui('checkout_country_us')}</option><option>${ui('checkout_country_jp')}</option><option>${ui('checkout_country_ca')}</option><option>${ui('checkout_country_uk')}</option>`;
      }
    }
    renderSummary();
    
    document.getElementById('checkout-form').addEventListener('submit', async event => {
      event.preventDefault();
      const error = document.getElementById('checkout-error');
      const submitBtn = event.target.querySelector('button[type="submit"]');
      
      error.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = ui('checkout_processing') || 'Processing...';
      
      const form = new FormData(event.target);
      const customer = {
        email: form.get('email'),
        name: form.get('name')
      };
      const shipping_address = {
        address: form.get('address'),
        city: form.get('city'),
        postal_code: form.get('postal_code'),
        country: form.get('country')
      };
      
      try {
        // Create payment intent on backend
        const intentRes = await fetch(`${API_URL}/store/payment-intent`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            amount: subtotal,
            currency: 'jpy',
            metadata: { email: customer.email }
          })
        });
        
        if (!intentRes.ok) throw new Error('Failed to create payment intent');
        const { clientSecret, intentId } = await intentRes.json();
        
        // Confirm payment with Stripe
        const { paymentIntent, error: stripeError } = await stripe.confirmCardPayment(clientSecret, {
          payment_method: {
            card: cardElement,
            billing_details: { name: customer.name, email: customer.email }
          }
        });
        
        if (stripeError) throw new Error(stripeError.message);
        if (paymentIntent.status !== 'succeeded') throw new Error('Payment was not completed');
        
        // Create order with successful payment
        const orderRes = await fetch(`${API_URL}/store/orders`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            customer,
            shipping_address,
            items: cart,
            payment_intent_id: intentId
          })
        });
        
        const orderData = await orderRes.json();
        if (!orderRes.ok) throw new Error(orderData.error || 'Failed to create order');
        
        localStorage.removeItem('shopping_cart');
        location.href = `/purchase-success.html?order_id=${encodeURIComponent(orderData.order_id)}`;
      } catch (requestError) {
        error.textContent = requestError.message;
        submitBtn.disabled = false;
        submitBtn.textContent = ui('checkout_place_order');
      }
    });
    
    window.__i18nOnLanguageChange = renderSummary;
  </script>
  <script src="/scripts/i18n.js"></script>
  <script src="/scripts/header-manager.js"></script>
</body>
</html>
