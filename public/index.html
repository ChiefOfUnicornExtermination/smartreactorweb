<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles/style.css">
  <title>Smart Device — Sign In</title>
  <style>
    body.store-page { background: #f7f6f2; }
    .auth-container { max-width: 500px; margin: 80px auto; padding: 0 6vw; }
    .auth-container h1 { font-family: Georgia, "Times New Roman", serif; font-size: 42px; font-weight: 400; margin-bottom: 8px; }
    .auth-container p { color: #596164; line-height: 1.7; margin-bottom: 30px; }
    .auth-box { background: #fff; border: 1px solid #dfe1df; padding: 35px; }
    .auth-tabs { display: flex; gap: 20px; margin-bottom: 28px; border-bottom: 1px solid #dfe1df; }
    .auth-tabs button { border: none; background: none; padding: 10px 0 14px; font-size: 14px; cursor: pointer; color: #697072; font-weight: 600; border-bottom: 2px solid transparent; }
    .auth-tabs button.active { color: #17202a; border-bottom-color: #17202a; }
    .auth-tab-pane { display: none; }
    .auth-tab-pane.active { display: block; }
    .auth-form-group { margin-bottom: 20px; }
    .auth-form-group label { display: block; font-size: 13px; font-weight: 600; color: #17202a; margin-bottom: 8px; }
    .auth-form-group input { width: 100%; padding: 12px; border: 1px solid #aeb4b3; background: #fff; font: inherit; }
    .auth-button { width: 100%; padding: 13px; border: none; background: #17202a; color: #fff; font-size: 14px; cursor: pointer; font-weight: 600; }
    .auth-button:hover { background: #0d1117; }
    .auth-alert { padding: 12px; border-radius: 4px; font-size: 13px; margin-top: 14px; display: none; }
    .auth-alert.show { display: block; }
    .auth-alert.error { background: #fce4ec; color: #c2185b; }
    .auth-alert.success { background: #e8f5e9; color: #2e7d32; }
    #lang-select { padding: 6px 8px; border: 1px solid #d8d8d8; background: #fff; border-radius: 3px; cursor: pointer; }
  </style>
</head>
<body class="store-page">
  <header class="store-header">
    <a class="store-brand" href="/shop.html">SMART DEVICE</a>
    <nav class="store-nav" aria-label="Main navigation">
      <a href="/shop.html" data-i18n="shop_nav_shop">Shop</a>
      <a href="/about.html" data-i18n="shop_nav_about">About</a>
      <a href="/contact.html" data-i18n="shop_nav_contact">Contact</a>
      <a id="devices-nav-link" href="/devices.html" data-i18n="shop_nav_my_devices" style="display:none;">My Devices</a>
    </nav>
    <div class="store-actions">
      <select id="lang-select" aria-label="Language" style="padding:6px 8px;border:1px solid #d8d8d8;background:#fff;border-radius:3px;">
        <option value="en">English</option>
        <option value="ja">日本語</option>
        <option value="es">Español</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="zh-TW">繁體中文</option>
        <option value="ko">한국어</option>
      </select>
      <span id="user-welcome" data-i18n="welcome_text" style="display:none;">Welcome!</span>
      <button id="toggle-auth-tab" data-i18n="login_tab" style="background:none;border:none;cursor:pointer;color:#17202a;font-weight:600;">Login</button>
      <button id="logout-btn" data-i18n="logout_btn" style="display:none;background:none;border:none;cursor:pointer;color:#17202a;font-weight:600;">Logout</button>
      <a id="cart-nav-link" href="/cart.html" class="cart-link" style="display:none;"><span data-i18n="shop_cart">Cart</span> <span id="cart-count">0</span></a>
    </div>
  </header>

  <main class="auth-container">
    <h1 data-i18n="title">Smart Device</h1>
    <p data-i18n="subtitle">Control your smart home</p>

    <div class="auth-box">
      <div class="auth-tabs">
        <button class="auth-tab-btn active" onclick="showTab('login')">Sign In</button>
        <button class="auth-tab-btn" onclick="showTab('signup')" data-i18n="signup_tab">Sign Up</button>
      </div>

      <!-- Login -->
      <div id="login" class="auth-tab-pane active">
        <form onsubmit="handleLogin(event)">
          <div class="auth-form-group">
            <label data-i18n="login_email_label">Email</label>
            <input type="email" id="login-email" required autocomplete="email">
          </div>
          <div class="auth-form-group">
            <label data-i18n="login_password_label">Password</label>
            <input type="password" id="login-password" required autocomplete="current-password">
          </div>
          <button type="submit" class="auth-button">Sign In</button>
          <div id="login-error" class="auth-alert error"></div>
        </form>
      </div>

      <!-- Signup -->
      <div id="signup" class="auth-tab-pane">
        <form onsubmit="handleSignup(event)">
          <div class="auth-form-group">
            <label data-i18n="signup_email_label">Email</label>
            <input type="email" id="signup-email" required autocomplete="email">
          </div>
          <div class="auth-form-group">
            <label data-i18n="signup_password_label">Password (min 6 characters)</label>
            <input type="password" id="signup-password" minlength="6" required autocomplete="new-password">
          </div>
          <div class="auth-form-group">
            <label data-i18n="signup_confirm_label">Confirm Password</label>
            <input type="password" id="signup-confirm" required autocomplete="new-password">
          </div>
          <button type="submit" class="auth-button" data-i18n="create_account_btn">Create Account</button>
          <div id="signup-error" class="auth-alert error"></div>
          <div id="signup-success" class="auth-alert success"></div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const API_URL = ['localhost', '127.0.0.1'].includes(window.location.hostname)
      ? 'http://localhost:8081'
      : 'https://api.unicornextermination.info';
    if (localStorage.getItem('auth_token')) window.location.href = '/devices.html';

    function showTab(name) {
      document.querySelectorAll('.auth-tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.auth-tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      document.querySelector(`.auth-tab-btn[onclick="showTab('${name}')"]`).classList.add('active');
    }

    function showAlert(id, msg, type) { 
      const el = document.getElementById(id); 
      el.textContent = msg; 
      el.className = 'auth-alert show ' + type; 
    }
    function hideAlert(id) { document.getElementById(id).classList.remove('show'); }

    async function handleLogin(event) {
      event.preventDefault();
      hideAlert('login-error');
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      try {
        const res  = await fetch(`${API_URL}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('user_id',    data.user_id);
        localStorage.setItem('user_email', data.email);
        window.location.href = '/devices.html';
      } catch (err) { showAlert('login-error', err.message, 'error'); }
    }

    async function handleSignup(event) {
      event.preventDefault();
      hideAlert('signup-error'); hideAlert('signup-success');
      const email    = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const confirm  = document.getElementById('signup-confirm').value;
      if (password !== confirm) { showAlert('signup-error', 'Passwords do not match', 'error'); return; }
      try {
        const res  = await fetch(`${API_URL}/auth/signup`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Signup failed');
        showAlert('signup-success', '✓ Account created! You can now sign in.', 'success');
        ['signup-email','signup-password','signup-confirm'].forEach(id => document.getElementById(id).value = '');
        setTimeout(() => showTab('login'), 2000);
      } catch (err) { showAlert('signup-error', err.message, 'error'); }
    }

    showTab('login');
  </script>
  <script src="/scripts/i18n.js"></script>
  <script src="/scripts/header-manager.js"></script>
</body>
</html>
