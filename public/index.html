<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <title>Smart Device — Sign In</title>
  <style>
    body { display: flex; align-items: center; justify-content: center; }
    .card { max-width: 400px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #lang-select { padding: 5px 8px; border-radius: 6px; border: none; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div>
        <h1 id="site-title">🌈 Smart Device</h1>
        <p id="site-subtitle">Control your light waver</p>
      </div>
      <div>
        <select id="lang-select">
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="zh-TW">繁體中文</option>
          <option value="ko">한국어</option>
        </select>
      </div>
    </div>

    <div class="card-body">
      <div class="tabs">
        <button class="tab-btn active" onclick="showTab('login')">Sign In</button>
        <button class="tab-btn" onclick="showTab('signup')">Sign Up</button>
      </div>

      <!-- Login -->
      <div id="login" class="tab-pane active">
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-primary btn-full">Sign In</button>
          <div id="login-error" class="alert alert-error"></div>
        </form>
      </div>

      <!-- Signup -->
      <div id="signup" class="tab-pane">
        <form onsubmit="handleSignup(event)">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signup-email" required autocomplete="email">
          </div>
          <div class="form-group">
            <label>Password (min 6 characters)</label>
            <input type="password" id="signup-password" minlength="6" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="signup-confirm" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-primary btn-full">Create Account</button>
          <div id="signup-error"   class="alert alert-error"></div>
          <div id="signup-success" class="alert alert-success"></div>
        </form>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://api.unicornextermination.info';
    if (localStorage.getItem('auth_token')) window.location.href = '/devices.html';

    function showTab(name) {
      document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(name).classList.add('active');
      document.querySelector(`.tab-btn[onclick="showTab('${name}')"]`).classList.add('active');
    }

    function showAlert(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.classList.add('show'); }
    function hideAlert(id) { document.getElementById(id).classList.remove('show'); }

    async function handleLogin(event) {
      event.preventDefault();
      hideAlert('login-error');
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      try {
        const res  = await fetch(`${API_URL}/auth/login`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('auth_token', data.token);
        localStorage.setItem('user_id',    data.user_id);
        localStorage.setItem('user_email', data.email);
        window.location.href = '/devices.html';
      } catch (err) { showAlert('login-error', err.message); }
    }

    async function handleSignup(event) {
      event.preventDefault();
      hideAlert('signup-error'); hideAlert('signup-success');
      const email    = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      const confirm  = document.getElementById('signup-confirm').value;
      if (password !== confirm) { showAlert('signup-error', 'Passwords do not match'); return; }
      try {
        const res  = await fetch(`${API_URL}/auth/signup`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Signup failed');
        showAlert('signup-success', '✓ Account created! You can now sign in.');
        ['signup-email','signup-password','signup-confirm'].forEach(id => document.getElementById(id).value = '');
        setTimeout(() => showTab('login'), 2000);
      } catch (err) { showAlert('signup-error', err.message); }
    }
  </script>
  <script src="/i18n.js"></script>
</body>
</html>
